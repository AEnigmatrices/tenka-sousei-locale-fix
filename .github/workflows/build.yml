name: Build Windows x86 DLL

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "tests/**"
      - "scripts/verify-exports.ps1"
      - "scripts/package-release.ps1"
      - "scripts/verify-release-package.ps1"
      - "VERSION"
      - "CHANGELOG.md"
      - "INSTALL.txt"
      - "LICENSE"
      - "d3d8.dll"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "source/**"
      - "tests/**"
      - "scripts/verify-exports.ps1"
      - "scripts/package-release.ps1"
      - "scripts/verify-release-package.ps1"
      - "VERSION"
      - "CHANGELOG.md"
      - "INSTALL.txt"
      - "LICENSE"
      - "d3d8.dll"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build x86 DLL and run native checks
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          if errorlevel 1 exit /b 1
          call source\build.cmd
          if errorlevel 1 exit /b 1
          call tests\run.cmd "%GITHUB_WORKSPACE%\d3d8.dll"
          if errorlevel 1 exit /b 1

      - name: Verify release packaging
        shell: pwsh
        run: |
          ./scripts/package-release.ps1
          ./scripts/verify-release-package.ps1

      - name: Upload compiled DLL
        uses: actions/upload-artifact@v7
        with:
          name: d3d8-windows-x86-build
          path: source/d3d8.dll
          if-no-files-found: error
