name: Build lean DLL candidate

on:
  push:
    branches: [experimental/lean-dll]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile x86 DLL
        shell: cmd
        working-directory: source
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          cl.exe /nologo /c /TC /O1 /Oi- /GS- /Zl /W4 /WX /D_WIN32_WINNT=0x0602 /FoD3D8Proxy.obj D3D8Proxy.c
          link.exe /NOLOGO /DLL /NODEFAULTLIB /ENTRY:DllMain@12 /SUBSYSTEM:WINDOWS /MACHINE:X86 /DYNAMICBASE /NXCOMPAT /SAFESEH /INCREMENTAL:NO /MANIFEST:NO /OPT:REF /OPT:ICF /DEF:d3d8.def /MAP:d3d8.map /OUT:d3d8.dll D3D8Proxy.obj kernel32.lib bcrypt.lib
      - name: Check PE exports and checksum
        shell: cmd
        working-directory: source
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          dumpbin.exe /headers d3d8.dll | findstr /C:"machine (x86)"
          dumpbin.exe /exports d3d8.dll
          certutil -hashfile d3d8.dll SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: lean-d3d8-candidate-untested
          path: source/d3d8.dll
          if-no-files-found: error
      - name: Commit untested candidate DLL to experimental branch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path candidate | Out-Null
          Copy-Item source/d3d8.dll candidate/d3d8.dll -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate/d3d8.dll
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build: attach untested lean DLL candidate"
            if ($LASTEXITCODE -ne 0) { throw "commit failed" }
            git push origin "HEAD:experimental/lean-dll"
            if ($LASTEXITCODE -ne 0) { throw "push failed" }
          }
